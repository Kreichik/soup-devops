[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "soup-gpu-budget-kreichik"
version = "0.1.0"
description = "A small GPU CI bill estimator, used to test a release pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Kreichik"}]
dependencies = ["tomli>=2.0.1,<3; python_version < '3.11'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
gpu-budget = "gpu_budget.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpu_budget = []

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

